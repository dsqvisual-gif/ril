<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Ril — планер</title>
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("ril-planner-v1") || "{}");
      if (saved.theme === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Cpath d='M8 16.2l5 5L24 10.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M5.5 12.5l4.2 4.2L18.5 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Ril</span>
        <span class="brand-tag">Планер</span>
      </span>
    </div>

    <div class="segmented" role="tablist" aria-label="Представление">
      <button class="segment is-active" type="button" role="tab" data-view-btn="day" aria-selected="true">День</button>
      <button class="segment" type="button" role="tab" data-view-btn="week" aria-selected="false">Неделя</button>
      <button class="segment" type="button" role="tab" data-view-btn="month" aria-selected="false">Месяц</button>
    </div>

    <div class="top-actions">
      <button class="awards-btn" type="button" data-open-awards>
        <svg class="mini-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="mini-track" cx="18" cy="18" r="15"></circle>
          <circle id="mini-value" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"></circle>
        </svg>
        <span class="awards-btn-text">
          <strong id="awards-count">0 из 10</strong>
          <em id="awards-caption">Десяток</em>
        </span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Сменить тему">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M14.5 3.2a8.8 8.8 0 1 0 6.3 14.2A8.2 8.2 0 0 1 14.5 3.2z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="outlet"></main>

  <dialog id="awards" class="sheet" aria-labelledby="awards-title"></dialog>
  <dialog id="celebrate" class="celebrate" aria-labelledby="celebrate-title"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
